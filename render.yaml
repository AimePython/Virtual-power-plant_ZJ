services:
  - type: web
    name: virtual-power-plant-zj
    runtime: python
    plan: starter
    rootDir: baseline_web_app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
